  Task 2: Calculator

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator | CodeAlpha Task 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="screen" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button data-k="c"  class="fn clear" aria-label="Clear">C</button>
      <button data-k="n"  class="fn" aria-label="Plus or minus">&plusmn;</button>
      <button data-k="%"  class="fn" aria-label="Percent">%</button>
      <button data-k="/"  class="op" aria-label="Divide">&divide;</button>

      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button data-k="*"  class="op" aria-label="Multiply">&times;</button>

      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button data-k="-"  class="op" aria-label="Subtract">&minus;</button>

      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button data-k="+"  class="op" aria-label="Add">+</button>

      <button data-k="b"  class="fn" aria-label="Delete last digit">&#9003;</button>
      <button data-k="0">0</button>
      <button data-k=".">.</button>
      <button data-k="="  class="eq" aria-label="Equals">=</button>
    </div>
    <p class="hint">Keyboard works too: digits, + - * /, Enter, Backspace, Esc</p>
  </main>
  <p class="credit">CodeAlpha Frontend Internship &middot; Task 2</p>
  <script src="script.js"></script>
</body>
</html>
